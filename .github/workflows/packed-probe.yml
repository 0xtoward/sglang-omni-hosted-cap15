name: Two containers on one hosted VM
on:
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        description: Place both partitions on one VM or give each its own VM
        options: [packed, separate, startup]
        default: packed
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.layout == 'separate' && '[12,13]' || inputs.layout == 'startup' && '[12]' || '[14]') }}
    concurrency:
      group: hosted-cpu-budget-slot-${{ matrix.slot }}
      queue: max
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang-omni
          ref: 5906e32279f9308564d97e334368172345cf2fa9
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .trial-control
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            .venv
            .uv-python
          key: hosted-cpu-v1-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          fail-on-cache-miss: true
      - name: Compare serial and parallel containers
        run: |
          nproc
          free -h
          docker version
          mkdir -p /tmp/empty-docker-context
          bash .trial-control/bench/packed.sh "${{ matrix.slot }}" "${{ inputs.layout }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-${{ matrix.slot }}
          path: results/
